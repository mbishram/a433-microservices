name: Build and Push Order Service

on: [push] # Run actions on push

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Use ubuntu latest.
    steps:
      - # Login to Github Packages.
        name: Login to Github Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - # Setup Docker Buildx to extend docker build capabilities. It's not required but RECOMMENDED.
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - # Build and push image to Github Packages.
        name: Build and push image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/mbishram/e-commerce-order-service:latest