# I don't specify "version" because it is obsolete

services:
  item-app:
    image: ghcr.io/mbishram/item-app:v1 # Get image from GitHub package
    restart: always # Always restart image when it stops
    ports:
      - "80:8080" # Map port 80 on host to 8080 on container
    depends_on:
      - item-db # Start item-db first
  item-db:
    image: mongo:3
    restart: always # Always restart image when it stops
    volumes:
      - "app-db:/data/db" # Map volumes "app-db" to /data/db on container

volumes:
  app-db:
